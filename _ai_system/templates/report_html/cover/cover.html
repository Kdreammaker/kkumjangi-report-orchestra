<section class="cover-page" data-cover-component="report-cover-v1">
  <div class="cover-topline">
    <div class="cover-classification-group">
      <span class="classification">{{classification}}</span>
      {{security_tag_html}}
    </div>
    <span class="report-type">{{report_type}}</span>
  </div>

  {{logo_html}}

  <div class="cover-hero">
    <p class="kicker">{{kicker}}</p>
    <h1>{{report_title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
  </div>

  {{meta_table_html}}

  <p class="cover-purpose">{{purpose}}</p>
  {{confidential_notice_html}}
</section>
