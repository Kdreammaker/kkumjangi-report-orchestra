name: 버그 신고
description: 개인 자료를 올리지 않고 재현 가능한 문제를 알려주세요.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 이슈는 이 저장소의 Issues 목록에 공개될 수 있습니다.
        사용자 자료, 보고서 원문, API 키, 쿠키, 계정 정보, 비공개 파트너 자료, 로컬 절대경로는 올리지 마세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었나요?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 시스템 버전
      description: VERSION.json 또는 설치 완료 메시지에 나온 버전을 적어 주세요.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: 예: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 사용 앱
      description: 예: Codex Desktop, Gemini Antigravity, Claude Code, ChatGPT, Cursor
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 사용 모델
      description: 예: Codex 5.5 보통, Gemini 3.5 Flash Low, Claude Sonnet 4.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 문제 영역
      options:
        - 설치/업데이트
        - 프로젝트 생성
        - 프로젝트 대시보드
        - 참고자료/문서대장
        - 보고서 작성 흐름
        - 표/그래프/표지
        - 검증기/게이트
        - 기타
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 가짜 예시 데이터로 재현 절차를 적어 주세요. 비공개 문서나 로컬 절대경로는 쓰지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 오류 메시지가 있다면 민감정보를 제거한 뒤 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 검증기 출력 또는 정리된 로그
      description: 개인정보, 내부 경로, 인증정보, 비공개 원문은 제거해 주세요.
    validations:
      required: false
  - type: textarea
    id: extra_environment
    attributes:
      label: 추가 환경 정보
      description: Python 버전, 설치 방식, public/private repo 여부, 작업 단계 등. 아는 범위만 적어 주세요.
    validations:
      required: false
  - type: checkboxes
    id: privacy_check
    attributes:
      label: 공개 전 확인
      options:
        - label: 이 이슈에 사용자 자료, 보고서 원문, 계정 정보, API 키, 쿠키, 비공개 파트너 자료를 포함하지 않았습니다.
          required: true
